name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bump & Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-edit --version 0.13.13 --locked

      - name: Bump version
        run: cargo set-version --bump ${{ inputs.bump }}

      - name: Read version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & tag
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "release: v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Push to GitHub
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.version }}"

  build-macos:
    name: Build macOS (arm64 + x64)
    needs: release
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      # macos-latest is Apple Silicon: arm64 is native, x86_64-apple-darwin
      # cross-compiles against the universal SDK already on the runner. The
      # x86_64 floor is kept low so the darwin-x64 bottle still runs on older
      # Intel Macs — the very users the second darwin target was added for.
      - name: Build
        run: |
          MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --release --locked --target aarch64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=10.15 cargo build --release --locked --target x86_64-apple-darwin

      - name: Package brew tarballs
        # One single-member tarball per Homebrew target: the org tap renders a
        # URL block for exactly omh-<version>-<brew target>.tar.gz (ADR-0001).
        run: |
          cp target/aarch64-apple-darwin/release/omh omh
          tar czf "omh-$VERSION-darwin-arm64.tar.gz" omh
          cp target/x86_64-apple-darwin/release/omh omh
          tar czf "omh-$VERSION-darwin-x64.tar.gz" omh
          for asset in "omh-$VERSION-darwin-arm64.tar.gz" "omh-$VERSION-darwin-x64.tar.gz"; do
            [ -s "$asset" ] || { echo "missing or empty: $asset"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: omh-*-darwin-*.tar.gz

  build-linux:
    name: Build Linux (x64 + arm64)
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install aarch64 cross-linker
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --locked --target aarch64-unknown-linux-gnu

      - name: Package brew tarballs
        run: |
          cp target/x86_64-unknown-linux-gnu/release/omh omh
          tar czf "omh-$VERSION-linux-x64.tar.gz" omh
          cp target/aarch64-unknown-linux-gnu/release/omh omh
          tar czf "omh-$VERSION-linux-arm64.tar.gz" omh
          for asset in "omh-$VERSION-linux-x64.tar.gz" "omh-$VERSION-linux-arm64.tar.gz"; do
            [ -s "$asset" ] || { echo "missing or empty: $asset"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: omh-*-linux-*.tar.gz

  build-windows:
    name: Build Windows (x64)
    needs: release
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "target\x86_64-pc-windows-msvc\release\omh.exe" "omh.exe"
          Compress-Archive -Path "omh.exe" -DestinationPath "omh-${env:VERSION}-win32-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: omh-*-win32-x64.zip

  github-release:
    name: GitHub Release
    needs: [ release, build-macos, build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.release.outputs.version }}" dist/* \
            --title "v${{ needs.release.outputs.version }}" \
            --generate-notes

  tap:
    name: Bump org Homebrew tap
    needs: [ release, github-release ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_TRIGGER_TOKEN }}
      TAP_REPO: xminihub/homebrew-tap
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # The tap owns the formula: this dispatches its bump workflow and waits
      # for the run to land, so a release that failed to bump fails here rather
      # than leaving a stale Formula/omh.rb behind (ADR-0001). The tap's
      # tools/omh.json must already exist (the tap PR lands before the first
      # migrated release).
      - name: Dispatch the formula bump
        id: dispatch
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run bump.yml --repo "$TAP_REPO" --ref main \
            -f name=omh -f version="$VERSION"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$TAP_REPO" --workflow bump.yml \
              --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started_at\")] | .[0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::bump.yml never started for omh $VERSION"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "bump run: https://github.com/$TAP_REPO/actions/runs/$run_id"

      - name: Wait for the bump to land
        run: |
          if ! gh run watch "${{ steps.dispatch.outputs.run_id }}" \
              --repo "$TAP_REPO" --exit-status --interval 20; then
            echo "::error::Formula/omh.rb was not bumped for $VERSION"
            exit 1
          fi
          gh run view "${{ steps.dispatch.outputs.run_id }}" --repo "$TAP_REPO" \
            --json conclusion --jq '"tap bump conclusion: \(.conclusion)"'
